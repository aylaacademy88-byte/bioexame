<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>امتحان الكربوهيدرات - منصة ألفا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep: #0b2e2c;
    --bg-mid: #0f3f3b;
    --panel: #103a37;
    --ring-gold: #d9a441;
    --ring-gold-soft: #f0c674;
    --sugar-rose: #e0736b;
    --text-light: #eef6f2;
    --text-muted: #9fc4bb;
    --correct: #4caf7d;
    --wrong: #e0736b;
    --line: rgba(217,164,65,0.25);
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 10%, rgba(217,164,65,0.10), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(224,115,107,0.10), transparent 45%),
      linear-gradient(160deg, var(--bg-deep), var(--bg-mid) 60%, #08211f);
    font-family:'Tajawal', sans-serif;
    color:var(--text-light);
    padding:32px 16px 60px;
    position:relative;
    overflow-x:hidden;
  }

  /* signature: hexagon ring lattice, echoing the pyranose sugar ring */
  .lattice{
    position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0.16;
  }
  .lattice svg{width:100%;height:100%;}

  .wrap{
    max-width:760px;
    margin:0 auto;
    position:relative;
    z-index:1;
  }

  header{
    text-align:center;
    margin-bottom:28px;
  }
  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:'Cairo', sans-serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:0.5px;
    color:var(--ring-gold-soft);
    background:rgba(217,164,65,0.08);
    border:1px solid var(--line);
    padding:6px 16px;
    border-radius:999px;
    margin-bottom:16px;
  }
  .eyebrow span.dot{width:6px;height:6px;border-radius:50%;background:var(--ring-gold);}

  h1{
    font-family:'Cairo', sans-serif;
    font-weight:800;
    font-size:clamp(26px, 5vw, 38px);
    margin:0 0 8px;
    color:var(--text-light);
  }
  h1 em{
    font-style:normal;
    color:var(--ring-gold-soft);
  }
  .sub{
    color:var(--text-muted);
    font-size:15px;
    margin:0;
  }

  .progress-track{
    height:6px;
    background:rgba(255,255,255,0.08);
    border-radius:99px;
    overflow:hidden;
    margin:26px 0 6px;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--ring-gold), var(--sugar-rose));
    width:0%;
    transition:width .45s cubic-bezier(.4,0,.2,1);
  }
  .progress-label{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    color:var(--text-muted);
    margin-bottom:18px;
    font-family:'Cairo',sans-serif;
  }
  .score-live{color:var(--ring-gold-soft); font-weight:700;}

  .card{
    background:linear-gradient(160deg, var(--panel), rgba(16,58,55,0.6));
    border:1px solid var(--line);
    border-radius:20px;
    padding:28px 24px;
    position:relative;
    box-shadow:0 20px 50px -20px rgba(0,0,0,0.5);
    animation:rise .4s ease both;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }

  .qnum{
    font-family:'Cairo', sans-serif;
    font-weight:800;
    font-size:14px;
    color:var(--ring-gold);
    margin-bottom:10px;
    letter-spacing:0.5px;
  }
  .qtext{
    font-size:19px;
    font-weight:500;
    line-height:1.7;
    margin:0 0 22px;
    color:var(--text-light);
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    border:1.5px solid var(--line);
    border-radius:13px;
    background:rgba(255,255,255,0.02);
    cursor:pointer;
    font-size:16px;
    text-align:right;
    transition:border-color .2s, background .2s, transform .15s;
    color:var(--text-light);
  }
  .opt:hover{border-color:var(--ring-gold); background:rgba(217,164,65,0.06);}
  .opt .badge{
    flex:0 0 26px;
    height:26px;
    border-radius:50%;
    border:1.5px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Cairo',sans-serif;
    font-size:13px;
    font-weight:700;
    color:var(--text-muted);
    transition:all .2s;
  }
  .opt.selected{border-color:var(--ring-gold); background:rgba(217,164,65,0.1);}
  .opt.selected .badge{background:var(--ring-gold); color:#0b2e2c; border-color:var(--ring-gold);}

  .opt.correct{border-color:var(--correct); background:rgba(76,175,125,0.12);}
  .opt.correct .badge{background:var(--correct); color:#0b2e2c; border-color:var(--correct);}
  .opt.wrong{border-color:var(--wrong); background:rgba(224,115,107,0.12);}
  .opt.wrong .badge{background:var(--wrong); color:#fff; border-color:var(--wrong);}
  .opt.disabled{cursor:default;}

  .explain{
    margin-top:16px;
    padding:14px 16px;
    border-radius:12px;
    background:rgba(0,0,0,0.18);
    border-right:3px solid var(--ring-gold);
    font-size:14.5px;
    line-height:1.8;
    color:var(--text-muted);
    display:none;
  }
  .explain.show{display:block; animation:rise .3s ease both;}
  .explain b{color:var(--ring-gold-soft);}

  .nav-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:24px;
  }
  .btn{
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:15px;
    padding:12px 26px;
    border-radius:12px;
    border:none;
    cursor:pointer;
    transition:transform .15s, opacity .15s;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{
    background:linear-gradient(90deg, var(--ring-gold), var(--ring-gold-soft));
    color:#0b2e2c;
  }
  .btn-primary:disabled{opacity:0.35; cursor:not-allowed;}
  .btn-ghost{
    background:transparent;
    color:var(--text-muted);
    border:1px solid var(--line);
  }

  .result{
    text-align:center;
    padding:20px 10px;
  }
  .result .ring-score{
    width:150px; height:150px;
    margin:0 auto 20px;
    position:relative;
  }
  .result .ring-score svg{width:100%; height:100%;}
  .result .ring-score .num{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Cairo',sans-serif;
    font-size:34px; font-weight:800;
    color:var(--text-light);
  }
  .result h2{
    font-family:'Cairo',sans-serif;
    font-size:24px;
    margin:0 0 6px;
  }
  .result p{color:var(--text-muted); margin:0 0 22px;}

  .review-list{
    text-align:right;
    margin-top:24px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .review-item{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:12px 14px;
    border-radius:10px;
    background:rgba(255,255,255,0.03);
    font-size:14px;
    line-height:1.6;
  }
  .review-item .mark{flex:0 0 20px; font-weight:800;}
  .review-item.ok .mark{color:var(--correct);}
  .review-item.bad .mark{color:var(--wrong);}

  footer{
    text-align:center;
    margin-top:30px;
    font-size:12.5px;
    color:var(--text-muted);
    opacity:0.7;
    font-family:'Cairo', sans-serif;
  }

  @media (max-width:480px){
    .card{padding:22px 16px;}
    .qtext{font-size:17px;}
  }
</style>
</head>
<body>

<div class="lattice" id="lattice"></div>

<div class="wrap">
  <header>
    <div class="eyebrow"><span class="dot"></span> منصّة ألفا التعليمية &nbsp;·&nbsp; الأحياء</div>
    <h1>امتحان درس <em>الكربوهيدرات</em></h1>
    <p class="sub">توجيهي الأردن — اختبر فهمك لأنواع السكريات وبنائها ووظائفها</p>
  </header>

  <div id="quiz-area">
    <div class="progress-label">
      <span>السؤال <span id="cur-q">1</span> من <span id="total-q">10</span></span>
      <span class="score-live">الإجابات الصحيحة: <span id="live-score">0</span></span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>

    <div class="card">
      <div class="qnum" id="qnum-label">السؤال 1</div>
      <p class="qtext" id="qtext"></p>
      <div class="options" id="options"></div>
      <div class="explain" id="explain"></div>
      <div class="nav-row">
        <button class="btn btn-ghost" id="btn-restart" style="visibility:hidden;">إعادة البدء</button>
        <button class="btn btn-primary" id="btn-next" disabled>التالي</button>
      </div>
    </div>
  </div>

  <div id="result-area" style="display:none;"></div>

  <footer>صُمم لمراجعة درس الكربوهيدرات — أحياء توجيهي</footer>
</div>

<script>
const questions = [
  {
    q: "أي مما يلي يُعد مثالاً على سكر أحادي (Monosaccharide)؟",
    options: ["الغلوكوز", "السكروز", "اللاكتوز", "النشا"],
    correct: 0,
    explain: "<b>الغلوكوز</b> سكر أحادي يتكون من وحدة سكرية واحدة (C6H12O6)، بينما السكروز واللاكتوز سكريات ثنائية، والنشا سكر عديد."
  },
  {
    q: "ينتج السكروز (Sucrose) من اتحاد أي سكرين أحاديين؟",
    options: ["غلوكوز + غلوكوز", "غلوكوز + غالاكتوز", "غلوكوز + فركتوز", "فركتوز + غالاكتوز"],
    correct: 2,
    explain: "يتكون <b>السكروز</b> من ارتباط جزيء غلوكوز بجزيء فركتوز برابطة جليكوسيدية، وينتج عن التحلل الماء (Dehydration synthesis)."
  },
  {
    q: "ما نوع الرابطة التي تصل بين وحدات السكر الأحادي في السكريات الثنائية والعديدة؟",
    options: ["الرابطة الببتيدية", "الرابطة الجليكوسيدية", "الرابطة الأيونية", "الرابطة الفوسفودايستر"],
    correct: 1,
    explain: "تتكون <b>الرابطة الجليكوسيدية</b> بين مجموعة الهيدروكسيل لسكر أحادي وأخرى لسكر آخر، مصحوبة بفقدان جزيء ماء."
  },
  {
    q: "أي من السكريات العديدة التالية يُخزَّن في خلايا الكبد والعضلات عند الإنسان؟",
    options: ["السليلوز", "الكيتين", "الغلايكوجين", "النشا"],
    correct: 2,
    explain: "<b>الغلايكوجين</b> هو المادة النشوية الحيوانية، يُخزَّن في الكبد والعضلات كمصدر احتياطي للطاقة."
  },
  {
    q: "ما الوظيفة الأساسية للسليلوز (Cellulose) في النباتات؟",
    options: ["تخزين الطاقة", "نقل المواد الغذائية", "تركيب الجدار الخلوي", "تكوين الإنزيمات"],
    correct: 2,
    explain: "يُشكّل <b>السليلوز</b> المكوّن الرئيسي للجدار الخلوي في النباتات، ويمنحه الصلابة والدعامة."
  },
  {
    q: "اللاكتوز (سكر الحليب) يتكون من اتحاد أي سكرين؟",
    options: ["غلوكوز + غلوكوز", "غلوكوز + غالاكتوز", "غلوكوز + فركتوز", "غالاكتوز + فركتوز"],
    correct: 1,
    explain: "يتكون <b>اللاكتوز</b> من ارتباط جزيء غلوكوز مع جزيء غالاكتوز، وهو السكر الرئيسي في حليب الثدييات."
  },
  {
    q: "لماذا لا يستطيع جسم الإنسان هضم السليلوز؟",
    options: [
      "لأنه سكر أحادي معقد التركيب",
      "لعدم امتلاك الإنسان الإنزيم المحلل للرابطة الجليكوسيدية بيتا",
      "لأنه مادة غير عضوية",
      "لأن السليلوز سام للخلايا"
    ],
    correct: 1,
    explain: "يفتقر جسم الإنسان لإنزيم <b>السليولاز</b> اللازم لتحليل الرابطة الجليكوسيدية من النوع بيتا (β) الموجودة في السليلوز، بعكس النشا ذي الرابطة ألفا (α)."
  },
  {
    q: "الصيغة الكيميائية العامة للسكريات الأحادية هي:",
    options: ["(CH2O)n", "C6H12O6 فقط", "CnH2nO", "C(H2O)2n"],
    correct: 0,
    explain: "تتبع السكريات الأحادية الصيغة العامة <b>(CH₂O)n</b> حيث n تمثل عدد ذرات الكربون، ومنها الغلوكوز حيث n=6."
  },
  {
    q: "أي مما يلي يُصنَّف ضمن السكريات العديدة (Polysaccharides)؟",
    options: ["الفركتوز والمالتوز", "الغلوكوز والغالاكتوز", "النشا والغلايكوجين والسليلوز", "السكروز واللاكتوز"],
    correct: 2,
    explain: "<b>النشا والغلايكوجين والسليلوز</b> جميعها سكريات عديدة، أي بوليمرات مكوّنة من عدد كبير من وحدات الغلوكوز المرتبطة جليكوسيدياً."
  },
  {
    q: "ما الوظيفة الحيوية الرئيسية للكربوهيدرات في الكائنات الحية؟",
    options: [
      "حمل الشيفرة الوراثية فقط",
      "مصدر رئيسي للطاقة ومكوّن بنائي في بعض الكائنات",
      "تنظيم درجة حرارة الجسم فقط",
      "نقل الأكسجين في الدم"
    ],
    correct: 1,
    explain: "الكربوهيدرات <b>مصدر رئيسي للطاقة</b> (كالغلوكوز) وتدخل في التراكيب البنائية مثل الجدار الخلوي النباتي والهيكل الخارجي للحشرات (الكيتين)."
  }
];

let current = 0;
let score = 0;
let answered = false;
const userAnswers = [];

const qtext = document.getElementById('qtext');
const optionsEl = document.getElementById('options');
const explainEl = document.getElementById('explain');
const btnNext = document.getElementById('btn-next');
const btnRestart = document.getElementById('btn-restart');
const curQEl = document.getElementById('cur-q');
const totalQEl = document.getElementById('total-q');
const liveScoreEl = document.getElementById('live-score');
const progressFill = document.getElementById('progress-fill');
const qnumLabel = document.getElementById('qnum-label');

totalQEl.textContent = questions.length;

function renderQuestion(){
  answered = false;
  btnNext.disabled = true;
  btnNext.textContent = current === questions.length - 1 ? 'إنهاء الامتحان' : 'التالي';
  explainEl.classList.remove('show');
  explainEl.innerHTML = '';

  const item = questions[current];
  qnumLabel.textContent = 'السؤال ' + (current + 1);
  qtext.textContent = item.q;
  curQEl.textContent = current + 1;
  liveScoreEl.textContent = score;
  progressFill.style.width = ((current) / questions.length * 100) + '%';

  optionsEl.innerHTML = '';
  const letters = ['أ','ب','ج','د'];
  item.options.forEach((optText, idx) => {
    const div = document.createElement('div');
    div.className = 'opt';
    div.innerHTML = `<span class="badge">${letters[idx]}</span><span>${optText}</span>`;
    div.addEventListener('click', () => selectOption(idx, div));
    optionsEl.appendChild(div);
  });
}

function selectOption(idx, el){
  if(answered) return;
  answered = true;
  const item = questions[current];
  const allOpts = optionsEl.querySelectorAll('.opt');
  allOpts.forEach(o => o.classList.add('disabled'));

  const isCorrect = idx === item.correct;
  if(isCorrect){
    score++;
    el.classList.add('correct');
  } else {
    el.classList.add('wrong');
    allOpts[item.correct].classList.add('correct');
  }
  userAnswers.push({idx, correct: isCorrect});
  liveScoreEl.textContent = score;

  explainEl.innerHTML = item.explain;
  explainEl.classList.add('show');
  btnNext.disabled = false;
}

btnNext.addEventListener('click', () => {
  current++;
  if(current >= questions.length){
    showResult();
  } else {
    renderQuestion();
  }
});

function showResult(){
  document.getElementById('quiz-area').style.display = 'none';
  const resultArea = document.getElementById('result-area');
  resultArea.style.display = 'block';

  const pct = Math.round((score / questions.length) * 100);
  const circumference = 2 * Math.PI * 60;
  const offset = circumference - (pct / 100) * circumference;

  let msg = 'أداء ممتاز! فهمك لدرس الكربوهيدرات قوي جداً.';
  if(pct < 50) msg = 'يحتاج الدرس لمراجعة إضافية، لا تقلق وحاول مجدداً.';
  else if(pct < 80) msg = 'أداء جيد! راجع الأسئلة التي أخطأت بها لترسيخ الفهم.';

  let reviewHTML = '';
  questions.forEach((item, i) => {
    const ua = userAnswers[i];
    const cls = ua.correct ? 'ok' : 'bad';
    const mark = ua.correct ? '✓' : '✗';
    reviewHTML += `<div class="review-item ${cls}"><span class="mark">${mark}</span><span>${item.q}</span></div>`;
  });

  resultArea.innerHTML = `
    <div class="card result">
      <div class="ring-score">
        <svg viewBox="0 0 140 140">
          <circle cx="70" cy="70" r="60" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="10"/>
          <circle cx="70" cy="70" r="60" fill="none" stroke="url(#grad)" stroke-width="10"
            stroke-linecap="round" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"
            transform="rotate(-90 70 70)"/>
          <defs>
            <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#d9a441"/>
              <stop offset="100%" stop-color="#e0736b"/>
            </linearGradient>
          </defs>
        </svg>
        <div class="num">${pct}%</div>
      </div>
      <h2>نتيجتك: ${score} من ${questions.length}</h2>
      <p>${msg}</p>
      <button class="btn btn-primary" id="btn-restart2">إعادة المحاولة</button>
      <div class="review-list">${reviewHTML}</div>
    </div>
  `;
  document.getElementById('btn-restart2').addEventListener('click', restart);
}

function restart(){
  current = 0;
  score = 0;
  userAnswers.length = 0;
  document.getElementById('result-area').style.display = 'none';
  document.getElementById('result-area').innerHTML = '';
  document.getElementById('quiz-area').style.display = 'block';
  renderQuestion();
}

// background hexagon lattice (pyranose ring motif)
function buildLattice(){
  const el = document.getElementById('lattice');
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 800 1200');
  svg.setAttribute('preserveAspectRatio', 'xMidYMid slice');

  function hexPoints(cx, cy, r){
    let pts = [];
    for(let i=0;i<6;i++){
      const angle = Math.PI/180 * (60*i - 30);
      pts.push((cx + r*Math.cos(angle)).toFixed(1) + ',' + (cy + r*Math.sin(angle)).toFixed(1));
    }
    return pts.join(' ');
  }

  const r = 46;
  const dx = r * 1.8;
  const dy = r * 1.56;
  for(let row=0; row<10; row++){
    for(let col=0; col<7; col++){
      const cx = col*dx + (row%2 ? dx/2 : 0) - 40;
      const cy = row*dy - 60;
      const poly = document.createElementNS(ns, 'polygon');
      poly.setAttribute('points', hexPoints(cx, cy, r));
      poly.setAttribute('fill', 'none');
      poly.setAttribute('stroke', '#d9a441');
      poly.setAttribute('stroke-width', '1');
      svg.appendChild(poly);
    }
  }
  el.appendChild(svg);
}
buildLattice();
renderQuestion();
</script>
</body>
</html>
